name: Build Installable APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK and Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK directory not found at $SDK_ROOT" >&2
            exit 1
          fi
          if [ ! -w "$SDK_ROOT" ] || { [ -d "$SDK_ROOT/licenses" ] && [ ! -w "$SDK_ROOT/licenses" ]; }; then
            sudo chown -R "$(id -u):$(id -g)" "$SDK_ROOT"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36.1" "build-tools;36.0.0"
          echo "Configured ANDROID_SDK_ROOT=$SDK_ROOT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore and env
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          touch .env

      - name: Build Debug APK
        run: >
          gradle :app:assembleDebug
          --no-configuration-cache
          --max-workers=2
          --stacktrace
          -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Rename APK for direct download
        run: cp app/build/outputs/apk/debug/app-debug.apk RiaziCraft-v3.0.apk

      - name: Publish Direct APK Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v3.0-run-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" RiaziCraft-v3.0.apk \
            --target "${{ github.sha }}" \
            --title "RiaziCraft v3.0" \
            --notes "فایل APK قابل نصب برنامه ریاضیکرفت (نسخه ۳.۰)"

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RiaziCraft-APK
          path: RiaziCraft-v3.0.apk
          if-no-files-found: error
